name: framework-audit
on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run framework self-audit
        run: python tools/audit/self_audit.py
