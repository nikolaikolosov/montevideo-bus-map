name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      # Scale-ladder drift check: pipeline constants vs measured data
      # properties (report: qa/reports/geometry-scales-report.md)
      - run: npm run verify:scales
      # Artifact-taxonomy sweep: every unexplained geometry artifact fails
      # the gate (whitelist: qa/route-geometry-whitelist.json; report:
      # qa/reports/route-geometry-oracles-report.md)
      - run: npm run verify:oracles
      # Journey cost-model drift check: the planner's detour factor vs what
      # the committed traces actually measure, plus network reachability
      # (report: qa/reports/journey-planner-report.md)
      - run: npm run verify:journey

  data-pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m ruff check
      - run: python -m pytest -q
      # Contract check on the committed data files (see architecture/contracts/)
      - run: python scripts/validate_data.py
      # Dependency CVE scan (runtime deps)
      - run: python -m pip_audit -r requirements.txt

  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Whole-map render verification: golden layer-manifest sweep over all 140
  # lines + curated pixel scenes (method: qa/reports/route-render-verification-method.md).
  # --update-snapshots=missing: first run on a new platform CREATES its
  # screenshot baselines (upload them from the artifact and commit); existing
  # baselines are compared strictly.
  render-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --update-snapshots=missing
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshot-baselines
          path: tests/e2e/__screenshots__/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
