name: Update Bus Data from API

on:
  schedule:
    # Run once an hour at the top of the hour
    - cron: '0 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

permissions:
  contents: write # Needed to commit and push changes

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; else pip install requests; fi

      - name: Fetch and Process API Data
        env:
          # Define standard environment variables that the user can map to their secrets
          API_CLIENT_ID: ${{ secrets.API_CLIENT_ID }}
          API_CLIENT_SECRET: ${{ secrets.API_CLIENT_SECRET }}
          API_AUTH_URL: ${{ secrets.API_AUTH_URL || 'https://api.montevideo.gub.uy/auth/token' }}
          API_ROUTES_URL: ${{ secrets.API_ROUTES_URL }}
          API_STOPS_URL: ${{ secrets.API_STOPS_URL }}
        run: |
          python fetch_api_data.py

      - name: Commit and push changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Add the generated files
          git add routes.js routes.json stops.js stops.json || true
          
          # Only commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update bus routes and stops data from API"
            git push
          fi
