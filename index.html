<!doctype html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <meta
            name="description"
            content="Explorador interactivo de recorridos de ómnibus de Montevideo"
        />
        <meta name="theme-color" content="#0f172a" />
        <meta
            http-equiv="Content-Security-Policy"
            content="default-src 'self'; script-src 'self' https://unpkg.com; style-src 'self' https://unpkg.com https://fonts.googleapis.com 'unsafe-inline'; img-src 'self' data: https://services.arcgisonline.com https://unpkg.com; font-src 'self' https://fonts.gstatic.com; connect-src 'self'; base-uri 'none'; object-src 'none';"
        />
        <meta name="referrer" content="strict-origin-when-cross-origin" />
        <link
            rel="icon"
            href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🚌</text></svg>"
            type="image/svg+xml"
        />
        <title>Montevideo Transit — recorridos de ómnibus de Montevideo</title>

        <!-- Google Fonts -->
        <link
            href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />

        <!-- Leaflet CSS -->
        <link
            rel="stylesheet"
            href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
            integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
            crossorigin=""
        />

        <!-- App styles -->
        <link rel="stylesheet" href="css/styles.css" />
    </head>

    <body>
        <!-- Loading Overlay -->
        <div
            id="loader"
            role="status"
            aria-live="polite"
            aria-label="Cargando datos del sistema"
            data-i18n-aria="loader.aria"
        >
            <div class="spinner"></div>
            <p data-i18n="loader.text">Cargando datos del sistema…</p>
        </div>

        <!-- Error Overlay (hidden until a load failure occurs) -->
        <div id="error-container" style="display: none" aria-hidden="true" role="alert">
            <h2 data-i18n="error.title">⚠️ Error al cargar</h2>
            <p id="error-message">No se pudieron cargar los datos del sistema.</p>
            <button
                type="button"
                id="errorRetry"
                class="btn"
                aria-label="Reintentá la carga de datos"
                data-i18n="error.retry"
                data-i18n-aria="error.retryAria"
            >
                Reintentá
            </button>
        </div>

        <!-- UI Panel -->
        <div id="ui-panel">
            <div class="panel-header">
                <h1>
                    <a
                        href="#/"
                        class="title-link"
                        aria-label="Ver todas las paradas"
                        data-i18n-aria="map.showAllAria"
                        >Montevideo Transit</a
                    >
                </h1>
                <div class="header-actions">
                    <div
                        class="lang-switcher"
                        role="group"
                        aria-label="Cambiar idioma"
                        data-i18n-aria="lang.groupAria"
                    >
                        <button
                            type="button"
                            class="lang-btn"
                            data-lang="es"
                            lang="es"
                            aria-label="Español"
                        >
                            ES
                        </button>
                        <button
                            type="button"
                            class="lang-btn"
                            data-lang="en"
                            lang="en"
                            aria-label="English"
                        >
                            EN
                        </button>
                        <button
                            type="button"
                            class="lang-btn"
                            data-lang="ru"
                            lang="ru"
                            aria-label="Русский"
                        >
                            RU
                        </button>
                    </div>
                    <button
                        type="button"
                        id="themeToggle"
                        class="theme-toggle"
                        aria-label="Cambiar a tema claro"
                    >
                        ☀️
                    </button>
                </div>
            </div>
            <p class="subtitle" data-i18n="app.subtitle">Explorador interactivo de recorridos</p>

            <div class="control-group">
                <label for="searchInput" data-i18n="search.label">Buscar</label>
                <div class="search-box">
                    <input
                        id="searchInput"
                        type="search"
                        inputmode="search"
                        enterkeyhint="search"
                        role="combobox"
                        autocomplete="off"
                        spellcheck="false"
                        aria-expanded="false"
                        aria-controls="searchList"
                        aria-autocomplete="list"
                        placeholder="Línea o parada…"
                        data-i18n-placeholder="search.placeholder"
                        aria-label="Buscá una línea o una parada"
                        data-i18n-aria="search.aria"
                    />
                    <button
                        type="button"
                        id="searchClear"
                        class="search-clear"
                        hidden
                        aria-label="Limpiar búsqueda"
                        data-i18n-aria="search.clearAria"
                    >
                        ×
                    </button>
                    <ul id="searchList" role="listbox" hidden></ul>
                </div>
            </div>

            <div id="contextBar" class="context-bar" hidden>
                <span id="contextText"></span>
                <button type="button" id="contextReset" class="context-reset"></button>
            </div>

            <!-- Journey planner (stop → stop with transfers) -->
            <section id="journeyPanel" class="journey-panel" aria-live="polite" hidden>
                <div class="journey-head">
                    <h2 data-i18n="journey.title">Viaje</h2>
                    <div class="journey-head-actions">
                        <button
                            type="button"
                            id="journeySwap"
                            class="journey-icon-btn"
                            aria-label="Intercambiar origen y destino"
                            data-i18n-aria="journey.swapAria"
                            data-i18n-title="journey.swapAria"
                        >
                            ⇅
                        </button>
                        <button
                            type="button"
                            id="journeyClear"
                            class="journey-icon-btn"
                            aria-label="Cancelar el viaje y volver al mapa"
                            data-i18n-aria="journey.clearAria"
                            data-i18n-title="journey.clearAria"
                        >
                            ×
                        </button>
                    </div>
                </div>

                <ul class="journey-endpoints" role="list">
                    <li>
                        <button type="button" id="journeyEditOrigin" class="journey-endpoint">
                            <span class="journey-pin journey-pin-a" aria-hidden="true">A</span>
                            <span class="journey-endpoint-label" data-i18n="journey.origin"
                                >Origen</span
                            >
                            <span id="journeyOrigin" class="journey-endpoint-name"></span>
                        </button>
                    </li>
                    <li>
                        <button type="button" id="journeyEditDestination" class="journey-endpoint">
                            <span class="journey-pin journey-pin-b" aria-hidden="true">B</span>
                            <span class="journey-endpoint-label" data-i18n="journey.destination"
                                >Destino</span
                            >
                            <span id="journeyDestination" class="journey-endpoint-name"></span>
                        </button>
                    </li>
                </ul>

                <p id="journeyMessage" class="journey-message" hidden></p>
                <div id="journeyOptions" class="journey-options" role="tablist" hidden></div>
                <ol id="journeyLegs" class="journey-legs" role="tabpanel"></ol>
                <p id="journeyNote" class="journey-note" data-i18n="journey.approx" hidden></p>
            </section>

            <div id="routeInfo" class="route-info" aria-live="polite">
                <!-- Destination picker: the headsigns a selected line serves. It
                     takes the ROW the old "Variantes de recorrido: 7" stat
                     vacated — pipeline vocabulary that could not be acted on
                     (ux-review-001 R4 / X1). Occupying that row rather than
                     adding a block is what keeps the mobile bottom sheet inside
                     its map-space budget. -->
                <div id="destinations" class="stat-row destinations" hidden>
                    <span class="stat-label" data-i18n="panel.destinations">Destino</span>
                    <div
                        id="destinationChips"
                        class="destination-chips"
                        role="group"
                        data-i18n-aria="panel.destinationAria"
                    ></div>
                </div>
                <div class="stat-row">
                    <span class="stat-label" data-i18n="panel.statStops">Total de paradas</span>
                    <span id="statStops" class="stat-value">-</span>
                </div>
            </div>

            <!-- Footer row: the data date and the support link share ONE line on
                 purpose. The mobile sheet has ~7 px of slack against its 24 %
                 map-space budget with a line selected (mobile-panel.spec.js), so
                 a block of its own is not affordable — and neither is the link
                 pushing the date onto a second line. -->
            <div class="panel-footer">
                <p id="dataFreshness" class="data-freshness" hidden></p>
                <!-- The heart is a span of its own, and the label another:
                     applyTranslations replaces textContent, which would take the
                     heart with it. Same shape as the sibling project's button
                     (safe-sun-map), deliberately. -->
                <a
                    id="supportLink"
                    class="support-link"
                    href="https://ko-fi.com/nikolaikolosov"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Apoyá al autor en Ko-fi (se abre en otra pestaña)"
                    title="Apoyá al autor en Ko-fi (se abre en otra pestaña)"
                    data-i18n-aria="support.aria"
                    data-i18n-title="support.aria"
                >
                    <span class="support-heart" aria-hidden="true">❤️</span>
                    <span class="support-label" data-i18n="support.label">Apoyar al autor</span>
                </a>
            </div>
        </div>

        <div
            id="map"
            role="application"
            aria-label="Mapa interactivo de recorridos de ómnibus"
            data-i18n-aria="map.aria"
        ></div>

        <!-- First-use hint (ux-review-001 R7, finding F6): the all-stops entry
             view answers no job by itself and nothing tells a first-time visitor
             that stops are tappable. Overlays the map so it costs the panel no
             height; shown once, then never again. -->
        <div id="firstUseHint" class="first-use-hint" role="status" hidden>
            <span data-i18n="hint.firstUse"
                >Tocá una parada del mapa o buscá una línea acá arriba.</span
            >
            <button
                type="button"
                id="firstUseHintDismiss"
                class="first-use-hint-dismiss"
                data-i18n="hint.dismiss"
                data-i18n-aria="hint.dismissAria"
            >
                Entendido
            </button>
        </div>

        <!-- Leaflet JS -->
        <script
            src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
            integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
            crossorigin=""
        ></script>

        <!-- App — ES module, loads data via fetch() -->
        <!-- (Parallel route offsets are computed in src/offsetline.js) -->
        <script type="module" src="src/app.js"></script>
    </body>
</html>
