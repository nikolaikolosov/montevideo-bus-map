<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Explorador interactivo de recorridos de ómnibus de Montevideo">
    <meta name="theme-color" content="#0f172a">
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='80' font-size='80'>🚌</text></svg>"
        type="image/svg+xml">
    <title>Montevideo Transit — recorridos de ómnibus de Montevideo</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />

    <!-- App styles -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <!-- Loading Overlay -->
    <div id="loader" role="status" aria-live="polite" aria-label="Cargando datos del sistema"
        data-i18n-aria="loader.aria">
        <div class="spinner"></div>
        <p data-i18n="loader.text">Cargando datos del sistema…</p>
    </div>

    <!-- Error Overlay (hidden until a load failure occurs) -->
    <div id="error-container" style="display:none" aria-hidden="true" role="alert">
        <h2 data-i18n="error.title">⚠️ Error al cargar</h2>
        <p id="error-message">No se pudieron cargar los datos del sistema.</p>
        <button type="button" class="btn" onclick="location.reload()"
            aria-label="Reintentá la carga de datos" data-i18n="error.retry"
            data-i18n-aria="error.retryAria">Reintentá</button>
    </div>

    <!-- UI Panel -->
    <div id="ui-panel">
        <div class="panel-header">
            <h1>Montevideo Transit</h1>
            <div class="header-actions">
                <div class="lang-switcher" role="group" aria-label="Cambiar idioma"
                    data-i18n-aria="lang.groupAria">
                    <button type="button" class="lang-btn" data-lang="es" lang="es"
                        aria-label="Español">ES</button>
                    <button type="button" class="lang-btn" data-lang="en" lang="en"
                        aria-label="English">EN</button>
                    <button type="button" class="lang-btn" data-lang="ru" lang="ru"
                        aria-label="Русский">RU</button>
                </div>
                <button type="button" id="themeToggle" class="theme-toggle"
                    aria-label="Cambiar a tema claro">☀️</button>
            </div>
        </div>
        <p class="subtitle" data-i18n="app.subtitle">Explorador interactivo de recorridos</p>

        <div class="control-group">
            <label for="searchInput" data-i18n="search.label">Buscar</label>
            <div class="search-box">
                <input id="searchInput" type="text" role="combobox" autocomplete="off"
                    spellcheck="false" aria-expanded="false" aria-controls="searchList"
                    aria-autocomplete="list" placeholder="Línea o parada…"
                    data-i18n-placeholder="search.placeholder"
                    aria-label="Buscá una línea o una parada" data-i18n-aria="search.aria">
                <ul id="searchList" role="listbox" hidden></ul>
            </div>
        </div>

        <div id="contextBar" class="context-bar" hidden>
            <span id="contextText"></span>
            <button type="button" id="contextReset" class="context-reset"></button>
        </div>

        <div id="routeInfo" class="route-info" aria-live="polite">
            <div class="stat-row">
                <span class="stat-label" data-i18n="panel.statVariants">Variantes de recorrido</span>
                <span id="statVariants" class="stat-value">-</span>
            </div>
            <div class="stat-row">
                <span class="stat-label" data-i18n="panel.statStops">Total de paradas</span>
                <span id="statStops" class="stat-value">-</span>
            </div>
        </div>

        <p id="dataFreshness" class="data-freshness" hidden></p>
    </div>

    <div id="map" role="application" aria-label="Mapa interactivo de recorridos de ómnibus"
        data-i18n-aria="map.aria"></div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
        integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- App — ES module, loads data via fetch() -->
    <!-- (Parallel route offsets are computed in src/offsetline.js) -->
    <script type="module" src="src/app.js"></script>
</body>

</html>
